<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MYP Graphing Tool Widget</title>
    <style>
        body { margin: 0; padding: 5px; background-color: transparent; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #333; user-select: none; }
        .lab-container { width: 100%; max-width: 960px; padding: 20px; background: #34495e; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .toolbar { width: 100%; background: #111; padding: 10px; border-radius: 6px 6px 0 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .tool-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar select, .toolbar button { background: #444; border: 1px solid #666; color: white; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; display: flex; align-items: center; justify-content: center; height: 36px; box-sizing: border-box; gap: 8px; }
        .toolbar button:hover { background: #555; }
        .toolbar button:disabled { opacity: 0.4; cursor: default; }
        .toolbar button.active { background: #1abc9c; border-color: #16a085; }
        .toolbar button.eraser-btn { padding: 4px 14px; }
        .toolbar button.eraser-btn.active { background: #e74c3c; border-color: #c0392b; }
        .scale-config-panel { display: flex; align-items: center; gap: 6px; background: #222; padding: 4px 8px; border-radius: 4px; border: 1px solid #444; color: #fff; font-size: 11px; font-weight: bold; height: 36px; box-sizing: border-box; }
        .scale-config-panel input { width: 35px; background: #444; border: 1px solid #666; color: white; text-align: center; padding: 2px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        .eraser-graphic { width: 20px; height: 20px; background: linear-gradient(135deg, #fff 0%, #fff 35%, #f39c12 35%, #f1c40f 65%, #e74c3c 65%); border: 1.5px solid #111; border-radius: 3px; transform: rotate(-15deg); box-shadow: 1px 1px 0px rgba(0,0,0,0.3); display: inline-block; }
        .graph-layout { display: grid; grid-template-columns: 85px 80px 750px; grid-template-rows: auto 500px 45px 40px; background: #ffffff; padding: 20px; border-radius: 0 0 6px 6px; color: #000; width: 100%; box-sizing: border-box; border: 2px solid #111; overflow-x: auto; }
        .title-header-wrapper { grid-column: 1 / span 3; grid-row: 1; display: flex; justify-content: center; align-items: center; gap: 25px; padding-bottom: 20px; width: 100%; }
        .school-logo { height: 80px; width: auto; object-fit: contain; }
        .title-input { width: 500px; max-width: 100%; text-align: center; font-size: 18px; font-weight: bold; padding: 8px; border: 2px dashed #34495e; background: #fdfefe; border-radius: 4px; resize: none; overflow: hidden; line-height: 1.3; height: 42px; font-family: inherit; box-sizing: border-box; user-select: text; }
        .title-input:focus { outline: none; border-color: #1abc9c; }
        .y-label-container { grid-column: 1; grid-row: 2; display: flex; align-items: center; justify-content: center; position: relative; }
        .y-label-input { transform: rotate(-90deg); width: 490px; text-align: center; font-size: 15px; font-weight: 600; padding: 8px 5px; border: 2px solid #2c3e50; background: #f8f9fa; box-sizing: border-box; position: absolute; white-space: nowrap; user-select: text; }
        .y-scale-container { grid-column: 2; grid-row: 2; position: relative; height: 500px; box-sizing: border-box; width: 100%; }
        .y-scale-row { display: flex; align-items: center; justify-content: flex-end; height: 22px; position: absolute; right: 0; transform: translateY(-11px); }
        .y-scale-row input { width: 32px; min-width: 32px; max-width: 70px; text-align: right; font-size: 11px; padding: 2px; border: 1px solid #aaa; border-radius: 3px; box-sizing: border-box; user-select: text; }
        .y-tick { width: 12px; height: 2px; background-color: #555; margin-left: 4px; }

        /* Canvas now sits inside a wrapper (no CSS borders, so drawing coordinates stay exact) */
        .canvas-wrap { grid-column: 3; grid-row: 2; position: relative; width: 700px; height: 500px; }
        canvas { display: block; width: 700px; height: 500px; background: #ffffff; cursor: crosshair; touch-action: none; }
        .label-editor { position: absolute; transform: translateY(-50%); min-width: 110px; font: 600 13px 'Segoe UI', system-ui, sans-serif; color: #2c3e50; padding: 3px 7px; border: 2px solid #1abc9c; border-radius: 5px; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.2); z-index: 5; user-select: text; outline: none; }

        .x-scale-container { grid-column: 3; grid-row: 3; display: flex; position: relative; width: 750px; height: 45px; box-sizing: border-box; }
        .x-scale-column { display: flex; flex-direction: column; align-items: center; position: absolute; transform: translateX(-50%); }
        .x-tick { width: 2px; height: 10px; background-color: #555; }
        .x-scale-column input { width: 32px; min-width: 32px; max-width: 70px; text-align: center; font-size: 11px; padding: 2px; border: 1px solid #aaa; border-radius: 3px; margin-top: 2px; box-sizing: border-box; user-select: text; }
        .bar-label-container { display: none; position: absolute; width: 750px; height: 45px; left: 0; top: 0; }
        .bar-label-box { position: absolute; width: 80px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        .bar-label-box input { width: 65px; text-align: center; font-size: 11px; padding: 2px; border: 1px solid #aaa; border-radius: 3px; margin-top: 2px; box-sizing: border-box; user-select: text; }
        .x-label-container { grid-column: 3; grid-row: 4; display: flex; justify-content: center; align-items: center; }
        .x-label-input { width: 400px; text-align: center; font-size: 14px; padding: 4px; border: 2px solid #2c3e50; background: #f8f9fa; font-weight: 600; user-select: text; }
        #textMeasurer { visibility: hidden; position: absolute; white-space: pre; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
</head>
<body>

    <div id="textMeasurer"></div>

    <div class="lab-container">
        <div class="toolbar">
            <div class="tool-group">
                <select id="graphType" onchange="switchGraphType()">
                    <option value="scatter">Scatter Plot / Line Graph</option>
                    <option value="bar">Bar Graph</option>
                </select>

                <div class="scale-config-panel" id="customScalePanel">
                    <span id="lblXConfig">X Boxes:</span>
                    <input type="number" id="inputXCount" min="1" max="20" value="5" onchange="updateBoxCounts()" />
                    <span style="margin-left: 4px;">Y Boxes:</span>
                    <input type="number" id="inputYCount" min="1" max="20" value="5" onchange="updateBoxCounts()" />
                </div>
            </div>

            <div class="tool-group">
                <button id="btnPlot" class="active" onclick="setTool('plot')">♦ Plot Point</button>
                <button id="btnLine" onclick="setTool('line')">╱ Line Tool</button>
                <button id="btnCurve" onclick="setTool('curve')" title="Click again to hide the curve">〰 Curve Tool</button>
                <button id="btnText" onclick="setTool('text')" title="Click on the graph to type a label">✏️ Text Tool</button>
                <button id="btnBar" style="display:none;" onclick="addBar()">+ Add Column Bar</button>

                <button id="btnErase" class="eraser-btn" onclick="setTool('erase')" title="Eraser Tool">
                    <div class="eraser-graphic"></div> Eraser
                </button>
            </div>

            <div class="tool-group">
                <button id="btnUndo" onclick="undo()" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
                <button id="btnRedo" onclick="redo()" title="Redo (Ctrl/Cmd+Y)">↷ Redo</button>
                <button style="background:#e74c3c; color: white;" onclick="clearGraph()">🗑 Reset Canvas</button>
            </div>
        </div>

        <div class="graph-layout">
            <div class="title-header-wrapper">
                <img src="FSK School (TS).png" alt="School Logo" class="school-logo" onerror="this.style.display='none'" />
                <textarea class="title-input" placeholder="Title of graph" rows="1" oninput="autoExpandTitle(this)"></textarea>
            </div>

            <div class="y-label-container"><input type="text" class="y-label-input" placeholder="Variable Name" /></div>
            <div class="y-scale-container" id="yScaleContainer"></div>

            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="graphCanvas"></canvas>
            </div>

            <div class="x-scale-container">
                <div id="scatterScaleBox" style="display: block; position: relative; width: 750px; height: 45px;"></div>
                <div id="barScaleBox" class="bar-label-container"></div>
            </div>

            <div class="x-label-container"><input type="text" class="x-label-input" placeholder="Variable Name" /></div>
        </div>
    </div>

    <script>
        const scatterBox = document.getElementById("scatterScaleBox");
        const yScaleContainer = document.getElementById("yScaleContainer");
        const barScaleBox = document.getElementById("barScaleBox");
        const measurer = document.getElementById("textMeasurer");
        const canvas = document.getElementById("graphCanvas");
        const wrap = document.getElementById("canvasWrap");
        const ctx = canvas.getContext("2d");

        // Plot area in CSS pixels. The backing store is scaled by devicePixelRatio for crisp lines.
        const W = 700, H = 500;
        const LABEL_FONT = "600 13px 'Segoe UI', system-ui, sans-serif";
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = W * dpr;
        canvas.height = H * dpr;

        let xBoxCount = 5;
        let yBoxCount = 5;
        let xScaleElements = [];
        let yScaleElements = [];
        let barScaleElements = [];
        let graphType = "scatter";
        let currentTool = "plot";

        let points = [];
        let lines = [];
        let bars = [];
        let textLabels = [];
        let curveShown = false;

        let isDrawingLine = false;
        let startPoint = null;
        let activeBarIndex = null;
        let isBarResizing = false;

        let undoStack = [];
        let redoStack = [];
        let editorEl = null;

        /* ---------- Helpers ---------- */
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            return {
                x: Math.max(0, Math.min(W, (e.clientX - r.left) * sx)),
                y: Math.max(0, Math.min(H, (e.clientY - r.top) * sy))
            };
        }

        function snapshot() {
            return JSON.parse(JSON.stringify({ points, lines, bars, textLabels, curveShown }));
        }
        function restore(s) {
            points = s.points; lines = s.lines; bars = s.bars; textLabels = s.textLabels; curveShown = s.curveShown;
        }
        function updateUndoButtons() {
            document.getElementById("btnUndo").disabled = undoStack.length === 0;
            document.getElementById("btnRedo").disabled = redoStack.length === 0;
        }
        function saveState() { undoStack.push(snapshot()); redoStack = []; updateUndoButtons(); }
        function undo() {
            if (undoStack.length === 0) return;
            closeEditor(false);
            redoStack.push(snapshot());
            restore(undoStack.pop());
            updateUndoButtons(); render();
        }
        function redo() {
            if (redoStack.length === 0) return;
            closeEditor(false);
            undoStack.push(snapshot());
            restore(redoStack.pop());
            updateUndoButtons(); render();
        }

        function labelWidth(t) {
            ctx.save(); ctx.font = LABEL_FONT;
            const w = ctx.measureText(t.text).width;
            ctx.restore();
            return w;
        }
        function hitLabel(t, mx, my) {
            const w = labelWidth(t);
            return mx >= t.x - 5 && mx <= t.x + w + 5 && Math.abs(my - t.y) <= 12;
        }

        /* ---------- Inline text editor (replaces prompt(), which is blocked inside embedded widgets) ---------- */
        function openEditor(x, y, existingIndex) {
            closeEditor(true);
            const input = document.createElement("input");
            input.type = "text";
            input.className = "label-editor";
            input.placeholder = "Type label, press Enter";
            input.maxLength = 60;
            const existing = existingIndex !== null ? textLabels[existingIndex] : null;
            if (existing) input.value = existing.text;
            input.style.left = Math.min(x, W - 120) + "px";
            input.style.top = Math.max(14, Math.min(y, H - 14)) + "px";
            wrap.appendChild(input);
            editorEl = { input, x, y, existingIndex, done: false };

            input.addEventListener("keydown", (ev) => {
                ev.stopPropagation();
                if (ev.key === "Enter") { closeEditor(true); }
                else if (ev.key === "Escape") { closeEditor(false); }
            });
            input.addEventListener("blur", () => closeEditor(true));
            setTimeout(() => { input.focus(); input.select(); }, 0);
        }

        function closeEditor(commit) {
            if (!editorEl || editorEl.done) return;
            const ed = editorEl;
            ed.done = true;
            editorEl = null;
            const text = ed.input.value.trim();
            ed.input.remove();
            if (commit) {
                if (ed.existingIndex !== null) {
                    const t = textLabels[ed.existingIndex];
                    if (t && text !== t.text) {
                        saveState();
                        if (text === "") textLabels.splice(ed.existingIndex, 1); else t.text = text;
                    }
                } else if (text !== "") {
                    saveState();
                    textLabels.push({ x: ed.x, y: ed.y, text });
                }
            }
            render();
        }

        /* ---------- Drawing ---------- */
        function drawGridBackground() {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = "#fcfeff";
            ctx.fillRect(0, 0, W, H);

            const minorX = xBoxCount * 5, minorY = yBoxCount * 5;
            const xAt = (i, n) => Math.min(W - 1, Math.round(i * W / n)) + 0.5;
            const yAt = (j, n) => Math.max(1, Math.round(H - j * H / n)) + 0.5;

            // Minor (fine) grid
            ctx.strokeStyle = "#c9dbe8";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 1; i < minorX; i++) {
                if (i % 5 === 0) continue;
                const x = xAt(i, minorX);
                ctx.moveTo(x, 0); ctx.lineTo(x, H);
            }
            for (let j = 1; j < minorY; j++) {
                if (j % 5 === 0) continue;
                const y = yAt(j, minorY);
                ctx.moveTo(0, y); ctx.lineTo(W, y);
            }
            ctx.stroke();

            // Major grid (one per labelled box)
            ctx.strokeStyle = "#5f7d95";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (let i = 1; i <= xBoxCount; i++) {
                const x = i === xBoxCount ? W - 1 : xAt(i * 5, minorX);
                ctx.moveTo(x, 0); ctx.lineTo(x, H);
            }
            for (let j = 1; j <= yBoxCount; j++) {
                const y = j === yBoxCount ? 1 : yAt(j * 5, minorY);
                ctx.moveTo(0, y); ctx.lineTo(W, y);
            }
            ctx.stroke();

            // Axes (heavy, drawn on top of the grid)
            ctx.strokeStyle = "#0b0b0b";
            ctx.lineWidth = 3;
            ctx.lineCap = "square";
            ctx.beginPath();
            ctx.moveTo(1.5, 0); ctx.lineTo(1.5, H);
            ctx.moveTo(0, H - 1.5); ctx.lineTo(W, H - 1.5);
            ctx.stroke();
            ctx.lineCap = "butt";
        }

        function drawSmoothCurve(c, pts) {
            if (pts.length < 2) return;
            c.beginPath();
            c.moveTo(pts[0].x, pts[0].y);
            for (let i = 0; i < pts.length - 1; i++) {
                let p0 = pts[i - 1] || pts[i];
                let p1 = pts[i];
                let p2 = pts[i + 1];
                let p3 = pts[i + 2] || p2;
                let cp1x = p1.x + (p2.x - p0.x) / 6;
                let cp1y = p1.y + (p2.y - p0.y) / 6;
                let cp2x = p2.x - (p3.x - p1.x) / 6;
                let cp2y = p2.y - (p3.y - p1.y) / 6;
                c.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
            }
            c.stroke();
        }

        function drawLabels() {
            ctx.font = LABEL_FONT;
            ctx.textBaseline = "middle";
            ctx.textAlign = "left";
            ctx.lineJoin = "round";
            textLabels.forEach(t => {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(255,255,255,0.92)";
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillStyle = "#1f2d3a";
                ctx.fillText(t.text, t.x, t.y);
            });
        }

        function render() {
            drawGridBackground();
            alignLabels();

            if (graphType === "scatter") {
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.strokeStyle = "#1f78b4";
                ctx.lineWidth = 2.6;
                if (curveShown) drawSmoothCurve(ctx, points);
                lines.forEach(l => {
                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                });
                ctx.lineCap = "butt";

                points.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -7); ctx.lineTo(7, 0); ctx.lineTo(0, 7); ctx.lineTo(-7, 0);
                    ctx.closePath();
                    ctx.fillStyle = "#e5383b";
                    ctx.fill();
                    ctx.shadowColor = "transparent";
                    ctx.lineWidth = 1.8;
                    ctx.strokeStyle = "#ffffff";
                    ctx.stroke();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "#7a1114";
                    ctx.beginPath();
                    ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.restore();
                });
            } else if (graphType === "bar") {
                bars.forEach((b) => {
                    const topY = H - b.height;
                    const grad = ctx.createLinearGradient(0, topY, 0, H);
                    grad.addColorStop(0, "rgba(52,152,219,0.95)");
                    grad.addColorStop(1, "rgba(31,97,141,0.85)");
                    ctx.save();
                    ctx.shadowColor = "rgba(0,0,0,0.25)";
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 2;
                    ctx.fillStyle = grad;
                    ctx.fillRect(b.x, topY, b.width, b.height - 3);
                    ctx.restore();
                    ctx.strokeStyle = "#154c79";
                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(b.x + 0.5, topY + 0.5, b.width - 1, b.height - 4);
                    // drag handle
                    const hx = b.x + b.width / 2 - 13;
                    ctx.fillStyle = "#1abc9c";
                    ctx.strokeStyle = "#0b6b58";
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(hx, topY - 5, 26, 10);
                    ctx.strokeRect(hx, topY - 5, 26, 10);
                });
            }
            drawLabels();
        }

        /* ---------- Axis labels / scale inputs ---------- */
        function autoExpandInput(inputEl) {
            measurer.textContent = inputEl.value || inputEl.placeholder || "";
            let computedWidth = measurer.offsetWidth + 10;
            inputEl.style.width = Math.max(32, Math.min(70, computedWidth)) + "px";
        }

        function autoExpandTitle(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 72) + 'px';
        }

        function setupAxisLabels() {
            let oldXValues = xScaleElements.map(el => { let inp = el.querySelector("input"); return inp ? inp.value : ""; });
            let oldBarValues = barScaleElements.map(el => { let inp = el.querySelector("input"); return inp ? inp.value : ""; });
            let oldYValues = yScaleElements.map(el => { let inp = el.querySelector("input"); return inp ? inp.value : ""; });

            scatterBox.innerHTML = "";
            yScaleContainer.innerHTML = "";
            barScaleBox.innerHTML = "";
            xScaleElements = [];
            yScaleElements = [];
            barScaleElements = [];

            for (let i = 0; i <= xBoxCount; i++) {
                let wrapper = document.createElement("div");
                wrapper.className = "x-scale-column";
                let tick = document.createElement("div");
                tick.className = "x-tick";
                let input = document.createElement("input");
                input.type = "text";
                if (i === 0 && !oldXValues.some(v => v)) input.placeholder = "0";
                if (oldXValues[i] !== undefined) input.value = oldXValues[i];
                input.addEventListener("input", function () { autoExpandInput(this); });
                autoExpandInput(input);
                wrapper.appendChild(tick);
                wrapper.appendChild(input);
                scatterBox.appendChild(wrapper);
                xScaleElements.push(wrapper);
            }

            for (let i = 0; i < xBoxCount; i++) {
                let box = document.createElement("div");
                box.className = "bar-label-box";
                let tick = document.createElement("div");
                tick.className = "x-tick";
                let input = document.createElement("input");
                input.type = "text";
                input.placeholder = "Category " + (i + 1);
                if (oldBarValues[i] !== undefined) input.value = oldBarValues[i];
                box.appendChild(tick);
                box.appendChild(input);
                barScaleBox.appendChild(box);
                barScaleElements.push(box);
            }

            for (let i = 0; i <= yBoxCount; i++) {
                let row = document.createElement("div");
                row.className = "y-scale-row";
                let input = document.createElement("input");
                input.type = "text";
                if (i === 0 && !oldYValues.some(v => v)) input.placeholder = "Max";
                if (i === yBoxCount && !oldYValues.some(v => v)) input.placeholder = "0";
                if (oldYValues[i] !== undefined) input.value = oldYValues[i];
                let tick = document.createElement("div");
                tick.className = "y-tick";
                input.addEventListener("input", function () { autoExpandInput(this); });
                autoExpandInput(input);
                row.appendChild(input);
                row.appendChild(tick);
                yScaleContainer.appendChild(row);
                input.style.width = "32px";
                yScaleElements.push(row);
            }
        }

        function updateBoxCounts() {
            let xVal = parseInt(document.getElementById("inputXCount").value);
            let yVal = parseInt(document.getElementById("inputYCount").value);
            if (isNaN(xVal) || xVal < 1) xVal = 1;
            if (isNaN(yVal) || yVal < 1) yVal = 1;
            if (xVal > 20) xVal = 20;
            if (yVal > 20) yVal = 20;
            if (graphType === "bar" && xVal > 10) xVal = 10;
            document.getElementById("inputXCount").value = xVal;
            document.getElementById("inputYCount").value = yVal;
            xBoxCount = xVal;
            yBoxCount = yVal;
            setupAxisLabels();
            render();
        }

        function alignLabels() {
            let stepX = W / xBoxCount;
            if (graphType === "scatter") {
                xScaleElements.forEach((el, index) => {
                    el.style.left = (index * stepX) + "px";
                    el.style.display = "flex";
                });
            } else {
                xScaleElements.forEach(el => el.style.display = "none");
                barScaleElements.forEach((el, index) => {
                    el.style.left = (index * stepX + (stepX / 2)) + "px";
                    el.style.display = "flex";
                });
            }
            let stepY = H / yBoxCount;
            yScaleElements.forEach((el, index) => {
                let currentStep = yBoxCount - index;
                el.style.top = (H - (currentStep * stepY)) + "px";
                el.style.display = "flex";
            });
        }

        function getDistanceToLine(px, py, x1, y1, x2, y2) {
            let dx = px - x1, dy = py - y1;
            let lx = x2 - x1, ly = y2 - y1;
            let dot = dx * lx + dy * ly;
            let lenSq = lx * lx + ly * ly;
            let param = lenSq !== 0 ? dot / lenSq : -1;
            let cx, cy;
            if (param < 0) { cx = x1; cy = y1; }
            else if (param > 1) { cx = x2; cy = y2; }
            else { cx = x1 + param * lx; cy = y1 + param * ly; }
            return Math.hypot(px - cx, py - cy);
        }

        /* ---------- Modes & tools ---------- */
        function switchGraphType() {
            closeEditor(false);
            graphType = document.getElementById("graphType").value;
            const labelX = document.getElementById("lblXConfig");
            const show = (id, on) => document.getElementById(id).style.display = on ? "inline-flex" : "none";
            if (graphType === "scatter") {
                labelX.textContent = "X Boxes:";
                show("btnPlot", true); show("btnLine", true); show("btnCurve", true); show("btnText", true); show("btnBar", false);
                document.getElementById("scatterScaleBox").style.display = "block";
                document.getElementById("barScaleBox").style.display = "none";
                setTool("plot");
            } else {
                labelX.textContent = "X Categories:";
                if (xBoxCount > 10) {
                    document.getElementById("inputXCount").value = 10;
                    xBoxCount = 10;
                }
                show("btnPlot", false); show("btnLine", false); show("btnCurve", false); show("btnText", true); show("btnBar", true);
                document.getElementById("scatterScaleBox").style.display = "none";
                document.getElementById("barScaleBox").style.display = "block";
                setTool("none");
                // No pre-filled bars: the user adds each column with "+ Add Column Bar"
            }
            setupAxisLabels();
            render();
        }

        function updateCursor() {
            const map = { plot: "crosshair", line: "crosshair", curve: "crosshair", text: "text", erase: "cell", none: "ns-resize" };
            canvas.style.cursor = map[currentTool] || "default";
        }

        function setTool(toolName) {
            closeEditor(true);
            if (toolName === "curve" && currentTool === "curve") {
                curveShown = !curveShown;       // click again to hide/show the curve
            } else if (toolName === "curve") {
                curveShown = true;
            }
            currentTool = toolName;
            ["plot", "line", "curve", "text", "erase"].forEach(t => {
                const id = "btn" + t.charAt(0).toUpperCase() + t.slice(1);
                const el = document.getElementById(id);
                if (el) el.classList.toggle("active", toolName === t);
            });
            updateCursor();
            render();
        }

        function addBar() {
            if (bars.length >= xBoxCount) return;
            saveState();
            let barWidth = 40;
            let stepX = W / xBoxCount;
            let posX = (bars.length * stepX) + (stepX / 2) - (barWidth / 2);
            bars.push({ x: posX, width: barWidth, height: 100 });
            render();
        }

        function clearGraph() {
            closeEditor(false);
            if (points.length > 0 || lines.length > 0 || bars.length > 0 || textLabels.length > 0) {
                saveState();
                points = []; lines = []; bars = []; textLabels = []; curveShown = false;
                render();
            }
        }

        window.addEventListener("keydown", (e) => {
            const tag = (e.target && e.target.tagName) || "";
            if (tag === "INPUT" || tag === "TEXTAREA") return;   // keep normal typing/undo inside fields
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const modifier = isMac ? e.metaKey : e.ctrlKey;
            if (modifier && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo(); else undo();
            } else if (modifier && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            }
        });

        /* ---------- Pointer interaction ---------- */
        canvas.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            const { x: mx, y: my } = getPos(e);

            if (currentTool === "erase") {
                const labelHit = textLabels.some(t => hitLabel(t, mx, my));
                saveState();
                if (labelHit) {
                    textLabels = textLabels.filter(t => !hitLabel(t, mx, my));
                } else if (graphType === "scatter") {
                    points = points.filter(p => Math.hypot(p.x - mx, p.y - my) > 11);
                    lines = lines.filter(l => getDistanceToLine(mx, my, l.x1, l.y1, l.x2, l.y2) > 8);
                } else {
                    let stepX = W / xBoxCount;
                    bars = bars.filter(b => !(mx >= b.x && mx <= (b.x + b.width)));
                    bars.forEach((b, idx) => { b.x = (idx * stepX) + (stepX / 2) - (b.width / 2); });
                }
                render();
                return;
            }

            if (currentTool === "text") {
                const idx = textLabels.findIndex(t => hitLabel(t, mx, my));
                openEditor(mx, my, idx >= 0 ? idx : null);
                if (idx >= 0) { editorEl.x = textLabels[idx].x; editorEl.y = textLabels[idx].y; }
                return;
            }

            canvas.setPointerCapture(e.pointerId);

            if (graphType === "scatter") {
                if (currentTool === "plot" || currentTool === "curve") {
                    saveState();
                    points.push({ x: mx, y: my });
                    points.sort((a, b) => a.x - b.x);
                } else if (currentTool === "line") {
                    isDrawingLine = true;
                    startPoint = { x: mx, y: my };
                }
            } else if (graphType === "bar") {
                bars.forEach((b, idx) => {
                    if (mx >= b.x && mx <= (b.x + b.width)) {
                        activeBarIndex = idx;
                        isBarResizing = false;
                    }
                });
            }
            render();
        });

        canvas.addEventListener("pointermove", (e) => {
            const { x: mx, y: my } = getPos(e);
            if (isDrawingLine && startPoint) {
                render();
                ctx.strokeStyle = "rgba(26, 188, 156, 0.85)";
                ctx.lineWidth = 2.4;
                ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(startPoint.x, startPoint.y);
                ctx.lineTo(mx, my);
                ctx.stroke();
                ctx.setLineDash([]);
            } else if (activeBarIndex !== null) {
                if (!isBarResizing) { saveState(); isBarResizing = true; }
                bars[activeBarIndex].height = Math.max(0, Math.min(H, H - my));
                render();
            }
        });

        function endPointer(e) {
            if (isDrawingLine && startPoint) {
                const { x, y } = getPos(e);
                if (Math.hypot(x - startPoint.x, y - startPoint.y) > 3) {
                    saveState();
                    lines.push({ x1: startPoint.x, y1: startPoint.y, x2: x, y2: y });
                }
            }
            isDrawingLine = false;
            startPoint = null;
            activeBarIndex = null;
            isBarResizing = false;
            render();
        }
        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);

        setupAxisLabels();
        updateUndoButtons();
        updateCursor();
        render();
    </script>
</body>
</html>
